<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0d0d0d"
    >

    <title>Luna AI</title>

    <link
        rel="stylesheet"
        href="style.css?v=21"
    >
</head>

<body>

    <header class="app-header">

        <div class="brand">

            <strong>Luna AI</strong>

            <small id="status">
                Testando app.js...
            </small>

        </div>

        <button
            id="clearButton"
            type="button"
        >
            Limpar
        </button>

    </header>


    <main
        id="chat"
        aria-live="polite"
        aria-label="Conversa com Luna"
    ></main>


    <section
        id="inputArea"
        aria-label="Enviar mensagem"
    >

        <textarea
            id="messageInput"
            rows="1"
            maxlength="2000"
            autocomplete="off"
            spellcheck="true"
            placeholder="Digite uma mensagem..."
            aria-label="Mensagem"
        ></textarea>

        <button
            id="sendButton"
            type="button"
        >
            Enviar
        </button>

    </section>


    <script type="module">

        const status =
            document.getElementById("status");

        status.textContent =
            "INDEX OK v21";

        try {

            await import("./app.js?v=21");

        } catch (error) {

            status.textContent =
                "ERRO APP.JS";

            const chat =
                document.getElementById("chat");

            const mensagem =
                document.createElement("div");

            mensagem.className =
                "message ai";

            mensagem.textContent =
                "ERRO AO CARREGAR APP.JS:\n\n" +
                (error?.message || error);

            chat.appendChild(mensagem);

            console.error(error);
        }

    </script>

</body>

</html>
