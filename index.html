<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Luna AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <strong>Luna AI</strong>
            <small id="status">Iniciando...</small>
        </div>

        <button id="clearButton">
            Limpar
        </button>
    </header>

    <main id="chat"></main>

    <div id="inputArea">

        <textarea
            id="messageInput"
            placeholder="Digite uma mensagem..."
        ></textarea>

        <button id="sendButton">
            Enviar
        </button>

    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
